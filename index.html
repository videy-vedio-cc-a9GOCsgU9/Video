<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoFile — File Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-primary:   #0b0f1a;
      --bg-card:      #111827;
      --bg-hover:     #1a2235;
      --border:       rgba(255,255,255,0.07);
      --accent:       #ef4444;
      --accent-glow:  rgba(239,68,68,0.25);
      --text-primary: #f1f5f9;
      --text-muted:   #64748b;
      --text-dim:     #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(239,68,68,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(99,102,241,0.04) 0%, transparent 50%);
    }

    /* ── HEADER ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,15,26,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .site-logo span { color: var(--accent); }

    .header-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── MAIN CONTENT ── */
    .main-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 16px 80px;
    }

    .section-title {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    #cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .file-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .file-card:hover {
      transform: translateY(-3px);
      border-color: rgba(239,68,68,0.35);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(239,68,68,0.1);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1a2235 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .card-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 40%, rgba(239,68,68,0.08), transparent 60%);
      z-index: 2;
    }
    .card-thumb-icon {
      font-size: 36px;
      opacity: 0.6;
      position: relative;
      z-index: 0;
    }
    .card-thumb-label {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(239,68,68,0.2);
      color: #fca5a5;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(239,68,68,0.3);
      letter-spacing: 0.5px;
      z-index: 3;
    }

    .card-body {
      padding: 14px 16px;
    }
    .card-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .card-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }
    .btn-play {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 7px;
      padding: 8px 0;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-play:hover {
      background: #dc2626;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .btn-open {
      background: rgba(255,255,255,0.06);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-open:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text-primary);
    }
  </style>
</head>
