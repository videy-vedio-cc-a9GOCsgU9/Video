<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoFile — File Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-primary:   #0b0f1a;
      --bg-card:      #111827;
      --bg-hover:     #1a2235;
      --border:       rgba(255,255,255,0.07);
      --accent:       #ef4444;
      --accent-glow:  rgba(239,68,68,0.25);
      --text-primary: #f1f5f9;
      --text-muted:   #64748b;
      --text-dim:     #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(239,68,68,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(99,102,241,0.04) 0%, transparent 50%);
    }

    /* ── HEADER ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,15,26,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .site-logo span { color: var(--accent); }

    .header-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── MAIN CONTENT ── */
    .main-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 16px 80px;
    }

    .section-title {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    #cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    /* ── CARD ── */
    .file-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      animation: fadeUp 0.4s ease both;
    }
    .file-card:hover {
      transform: translateY(-3px);
      border-color: rgba(239,68,68,0.35);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(239,68,68,0.1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1a2235 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .card-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 40%, rgba(239,68,68,0.08), transparent 60%);
      z-index: 2;
    }
    .card-thumb-icon {
      font-size: 36px;
      opacity: 0.6;
      position: relative;
      z-index: 0;
    }
    .card-thumb-label {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(239,68,68,0.2);
      color: #fca5a5;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(239,68,68,0.3);
      letter-spacing: 0.5px;
      z-index: 3;
    }

    .card-body {
      padding: 14px 16px;
    }
    .card-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .card-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }
    .btn-play {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 7px;
      padding: 8px 0;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-play:hover {
      background: #dc2626;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .btn-open {
      background: rgba(255,255,255,0.06);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-open:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text-primary);
    }

    /* ── STATES ── */
    .state-box {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      text-align: center;
    }
    .state-icon { font-size: 40px; opacity: 0.4; }

    .loader {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 20px 28px;
      color: #fca5a5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.7;
      max-width: 480px;
      width: 100%;
    }
    .error-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-logo">Go<span>X</span></div>
    <div class="header-badge">FILE HOST</div>
  </header>

  <main class="main-wrap">
    <div class="section-title">All Files</div>
    <div id="cards-container">
      </div>
  </main>

  <script>
    /* ============================================================
       ▶  CONFIG — Change these two values only
    ============================================================ */
    const GITHUB_USERNAME = "videy-vedio-cc-a9GOCsgU9";   
    const GITHUB_REPO     = "Video";                  
    /* ============================================================ */

    const FOLDER_PATH = "d";   
    const API_URL     = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

    const container = document.getElementById("cards-container");

    /* ── Helpers ── */
    function showLoading() {
      container.innerHTML = `
        <div class="state-box">
          <div class="loader"></div>
          <span>Fetching files&hellip;</span>
        </div>`;
    }

    function showError(msg) {
      container.innerHTML = `
        <div class="state-box">
          <div class="error-box">
            <div class="error-title">⚠ Failed to load files</div>
            ${msg}
          </div>
        </div>`;
    }

    function showEmpty() {
      container.innerHTML = `
        <div class="state-box">
          <div class="state-icon">📂</div>
          <span>No folders found inside <code>/${FOLDER_PATH}</code></span>
        </div>`;
    }

    /* ── Build one card ── */
    function createCard(folderName) {
      const url  = `/d/${folderName}`;
      const card = document.createElement("div");
      card.className = "file-card";
      
      // ছবির ট্রিক: ফোল্ডারের ভেতরের থাম্বনেইল হিসেবে আমরা একটা ডিফল্ট আকর্ষণীয় ইমেজ সেট করে দিচ্ছি
      card.innerHTML = `
        <div class="card-thumb">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEB9M7K3-_TBCTICxWi8Ww9pJrgt-K6Q5_oKy5WJ_1Fw&amp;s=10" alt="thumbnail">
          <span class="card-thumb-icon">🎬</span>
          <span class="card-thumb-label">FOLDER</span>
        </div>
        <div class="card-body">
          <div class="card-name">${folderName}</div>
          <div class="card-meta">/d/${folderName}</div>
          <div class="card-actions">
            <button class="btn-play">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                <path d="M2 1.5l8 4.5-8 4.5V1.5z"/>
              </svg>
              Open
            </button>
            <button class="btn-open" title="Open in new tab">↗</button>
          </div>
        </div>`;

      /* Whole card click */
      card.addEventListener("click", (e) => {
        if (e.target.closest(".btn-open")) return;
        window.open(url, "_blank");
      });

      /* Arrow button */
      card.querySelector(".btn-open").addEventListener("click", (e) => {
        e.stopPropagation();
        window.open(url, "_blank");
      });

      return card;
    }

    /* ── Fetch from GitHub API ── */
    async function loadFolders() {
      showLoading();
      try {
        const res = await fetch(API_URL, {
          headers: { "Accept": "application/vnd.github+json" }
        });

        if (res.status === 404) {
          showError(`Repository or folder not found.<br> Check that the folder exists.`);
          return;
        }
        if (res.status === 403) {
          showError("GitHub API rate limit exceeded. Try again in a minute.");
          return;
        }
        if (!res.ok) {
          showError(`GitHub API returned HTTP ${res.status}.`);
          return;
        }

        const items = await res.json();
        const folders = items.filter(i => i.type === "dir");

        if (folders.length === 0) {
          showEmpty();
          return;
        }

        container.innerHTML = "";
        folders.forEach(folder => {
          container.appendChild(createCard(folder.name));
        });

      } catch (err) {
        showError(`Network error: ${err.message}`);
      }
    }

    /* ── Run ── */
    loadFolders();
  </script>

</body>
</html>
